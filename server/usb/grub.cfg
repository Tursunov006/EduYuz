# EduYuz: avtomatik o'rnatish menyusi. Fleshkadagi /boot/grub/grub.cfg faylini shu bilan almashtiring.
# 5 soniyadan keyin klaviaturasiz o'zi o'rnatishni boshlaydi.
set timeout=5
set default=0
loadfont unicode
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "EduYuz server - avtomatik o'rnatish (diskni o'chiradi!)" {
	set gfxpayload=keep
	linux	/casper/vmlinuz autoinstall ---
	initrd	/casper/initrd
}
menuentry "Try or Install Ubuntu Server (qo'lda)" {
	set gfxpayload=keep
	linux	/casper/vmlinuz  ---
	initrd	/casper/initrd
}
